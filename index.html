<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Follow @Angelaaa04 on Instagram, Facebook and TikTok. Connect with me on all my social media platforms." />
  <meta property="og:title" content="@Angelaaa04 — My Links" />
  <meta property="og:description" content="Follow me on Instagram, Facebook & TikTok!" />
  <meta property="og:image" content="profile_avatar.jpg" />
  <title>@Angelaaa04 — My Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Falling sakura petals -->
  <div class="petals" aria-hidden="true" id="petals-container"></div>

  <!-- Ambient orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="page-wrapper">
    <section class="profile-section" aria-label="Profile information">
      <div class="card">

        <!-- Avatar -->
        <div class="avatar-wrapper">
          <div class="avatar-glow" aria-hidden="true"></div>
          <div class="avatar-ring">
            <img src="profile_avatar.jpg" alt="Angelaaa profile picture" class="avatar" id="avatar-img" />
          </div>
          <div class="avatar-badge" aria-label="Verified" title="Verified">✦</div>
        </div>

        <!-- Name & Bio -->
        <div class="profile-info">
          <h1 class="profile-name">
            <span class="name-text">@Angelaaa</span>
            <span class="name-sparkles" aria-hidden="true">
              <span class="ns ns-1">✦</span>
              <span class="ns ns-2">✧</span>
              <span class="ns ns-3">✦</span>
            </span>
          </h1>
          <p class="profile-bio">You Found Me.</p>
        </div>

        <!-- Divider -->
        <div class="divider" aria-hidden="true">
          <span class="divider-line"></span>
          <span class="divider-icon">🌸</span>
          <span class="divider-line"></span>
        </div>

        <!-- Social Links -->
        <div class="links-container" role="list" aria-label="Social media links">

          <!-- Instagram -->
          <a href="https://www.instagram.com/yourgurl_gelaa" target="_blank" rel="noopener noreferrer"
            class="link-card link-card--instagram" role="listitem" id="link-instagram"
            aria-label="Visit Instagram profile @yourgurl_gelaa">
            <div class="link-card__icon-wrap">
              <svg class="link-card__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                  <radialGradient id="ig-rg" cx="30%" cy="107%" r="150%">
                    <stop offset="0%" stop-color="#FFDC80" />
                    <stop offset="25%" stop-color="#FCAF45" />
                    <stop offset="45%" stop-color="#F77737" />
                    <stop offset="55%" stop-color="#FD1D1D" />
                    <stop offset="75%" stop-color="#E1306C" />
                    <stop offset="100%" stop-color="#833AB4" />
                  </radialGradient>
                </defs>
                <rect width="24" height="24" rx="5.5" fill="url(#ig-rg)" />
                <rect x="5.5" y="5.5" width="13" height="13" rx="3.5" stroke="white" stroke-width="1.5" fill="none" />
                <circle cx="12" cy="12" r="3.2" stroke="white" stroke-width="1.5" fill="none" />
                <circle cx="17" cy="7" r="1.1" fill="white" />
              </svg>
            </div>
            <div class="link-card__text">
              <span class="link-card__label">Instagram</span>
              <span class="link-card__handle">@yourgurl_gelaa</span>
            </div>
            <div class="link-card__arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12H19M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </div>
            <div class="link-card__shine" aria-hidden="true"></div>
            <div class="link-card__glow" aria-hidden="true"></div>
          </a>

          <!-- Facebook -->
          <a href="https://www.facebook.com/Itsangelo.a/" target="_blank" rel="noopener noreferrer"
            class="link-card link-card--facebook" role="listitem" id="link-facebook"
            aria-label="Visit Facebook profile Itsangelo.a">
            <div class="link-card__icon-wrap">
              <svg class="link-card__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="24" height="24" rx="5.5" fill="#1877F2" />

                  d="M10 20.5V13H8V10.5H10V8.5C10 5.5 11.5 4 14 4H16V6.5H14C13 6.5 13 7.5 13 8.5V10.5H16L15.5 13H13V20.5Z"

              <span class="link-card__label">Facebook</span>
              <span class="link-card__handle">Itsangelo.a</span>
            </div>
            <div class="link-card__arrow" aria-hidden="true">

                <path d="M5 12H19M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </div>
            <div class="link-card__shine" aria-hidden="true"></div>
            <div class="link-card__glow" aria-hidden="true"></div>
          </a>

            <div class="link-card__icon-wrap">
              <svg class="link-card__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                  <clipPath id="tt-clip">
                    <rect width="24" height="24" rx="5.5" />

                <g clip-path="url(#tt-clip)">
                  <path transform="translate(-0.7, 0.7)" fill="#69C9D0"

                  <path transform="translate(0.7, -0.7)" fill="#EE1D52"

              <span class="link-card__handle">@talking_angxla0</span>

            <div class="link-card__arrow" aria-hidden="true">

          <!-- Gmail -->
          <a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=markangeloabangan0@gmail.com"
            target="_blank" rel="noopener noreferrer" class="link-card link-card--gmail" role="listitem"
            id="link-gmail" aria-label="Email markangeloabangan0@gmail.com">
            <div class="link-card__icon-wrap">
              <img class="link-card__icon"
                src="https://www.gstatic.com/images/branding/product/1x/gmail_48dp.png" alt="" aria-hidden="true" />
            </div>
            <div class="link-card__text">
              <span class="link-card__label">Gmail</span>
              <span class="link-card__handle">markangeloabangan0@gmail.com</span>
            </div>
            <div class="link-card__arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12H19M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </div>
            <div class="link-card__shine" aria-hidden="true"></div>
            <div class="link-card__glow" aria-hidden="true"></div>
          </a>

        </div>

        <!-- Footer -->
        <footer class="page-footer">
          <p class="footer-text">Made by Angela <span class="heart">♥</span></p>
        </footer>

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
